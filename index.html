<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin Dashboard v6.2 | Advanced Export</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1; --panay: #0ea5e9; --mindanao: #f59e0b;
            --bg: #f1f5f9; --white: #ffffff; --text: #1e293b; --success: #10b981; --info: #3b82f6;
        }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); padding: 20px; color: var(--text); line-height: 1.5; }
        .container { max-width: 1550px; margin: 0 auto; background: var(--white); padding: 30px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
        
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        
        .batch-summary { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .batch-badge { background: #e2e8f0; padding: 8px 15px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; border: 1px solid #cbd5e1; display: flex; align-items: center; gap: 5px; }
        .batch-badge span { color: var(--text); font-weight: 800; }
        .batch-badge.b-panay { border-left: 5px solid var(--panay); background: #e0f2fe; }
        .batch-badge.b-mindanao { border-left: 5px solid var(--mindanao); background: #fef3c7; }

        .source-switcher { display: flex; gap: 10px; background: #e2e8f0; padding: 5px; border-radius: 50px; margin-bottom: 20px; width: fit-content; }
        .source-pill { padding: 10px 20px; border-radius: 50px; border: none; font-weight: 800; font-size: 0.75rem; cursor: pointer; color: #64748b; background: transparent; transition: 0.3s; }
        .source-pill.active { background: white; color: var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: #f8fafc; padding: 20px; border-radius: 18px; border: 1px solid #e2e8f0; border-bottom: 4px solid #cbd5e1; }
        .stat-card.active-source { border-bottom-color: var(--primary); background: #f0f4ff; }
        .stat-card h3 { font-size: 1.5rem; margin-top: 5px; }

        .controls-wrapper { display: grid; grid-template-columns: 1.8fr 1.2fr; gap: 20px; margin-bottom: 25px; }
        .controls, .export-box { background: #f8fafc; padding: 20px; border-radius: 16px; border: 1px solid #e2e8f0; }
        
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .export-box { border-left: 5px solid var(--success); }
        
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.7rem; font-weight: 800; color: #64748b; text-transform: uppercase; }
        select, input { padding: 10px; border-radius: 10px; border: 1.5px solid #cbd5e1; outline: none; font-size: 0.85rem; }

        .table-wrapper { overflow-x: auto; border-radius: 12px; border: 1px solid #e2e8f0; max-height: 600px; }
        table { width: 100%; border-collapse: collapse; min-width: 1200px; }
        th { background: #f1f5f9; padding: 15px; text-align: left; font-size: 0.7rem; text-transform: uppercase; color: #475569; position: sticky; top: 0; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 0.85rem; }
        
        .tag { padding: 3px 8px; border-radius: 5px; font-size: 0.6rem; font-weight: 900; color: white; text-transform: uppercase; }
        .tag-panay { background: var(--panay); }
        .tag-mindanao { background: var(--mindanao); }
        .tag-original { background: var(--primary); }
        
        .btn-sync { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; }
        .btn-export-batch { background: var(--info); color: white; border: none; padding: 8px 12px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.75rem; flex: 1; }
        .btn-export-day { background: var(--success); color: white; border: none; padding: 8px 12px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.75rem; flex: 1; }
        .btn-export-batch:hover, .btn-export-day:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <div>
            <h2>Admin Master Panel v6.2</h2>
            <p style="font-size: 0.8rem; color: #64748b; margin-top: 5px;">Data Integrity Sync | Selective Exporting</p>
        </div>
        <button onclick="fetchAllData()" class="btn-sync" id="syncBtn">🔄 Sync All Sheets</button>
    </div>

    <div class="source-switcher">
        <button class="source-pill active" onclick="switchSource('original', this)">📁 MASTER</button>
        <button class="source-pill" onclick="switchSource('panay', this)">🏝️ PANAY</button>
        <button class="source-pill" onclick="switchSource('mindanao', this)">⛰️ MINDANAO</button>
    </div>

    <div class="batch-summary" id="batchSummary">
        <div class="batch-badge">B1: <span id="count-b1">0</span></div>
        <div class="batch-badge">B2: <span id="count-b2">0</span></div>
        <div class="batch-badge b-panay">B3 (PANAY): <span id="count-b3">0</span></div>
        <div class="batch-badge b-mindanao">B4 (MINDANAO): <span id="count-b4">0</span></div>
        <div class="batch-badge">B5: <span id="count-b5">0</span></div>
        <div class="batch-badge">B6: <span id="count-b6">0</span></div>
    </div>

    <div class="stats-grid">
        <div class="stat-card active-source" id="card-original"><small>Unique Master Entries</small><h3 id="stat-orig-count">0</h3></div>
        <div class="stat-card" id="card-panay"><small>Unique Panay Entries</small><h3 id="stat-pan-count">0</h3></div>
        <div class="stat-card" id="card-mindanao"><small>Unique Mindanao Entries</small><h3 id="stat-min-count">0</h3></div>
    </div>

    <div class="controls-wrapper">
        <div class="controls">
            <div class="control-group">
                <label>Search Teacher/School</label>
                <input type="text" id="searchInput" placeholder="Type to filter..." onkeyup="applyFilters()">
            </div>
            <div class="control-group">
                <label>Filter Batch</label>
                <select id="batchFilter" onchange="applyFilters()">
                    <option value="">All Batches</option>
                    <option value="batch1">Batch 1</option>
                    <option value="batch2">Batch 2</option>
                    <option value="batch3">Batch 3 (Panay)</option>
                    <option value="batch4">Batch 4 (Mindanao)</option>
                    <option value="batch5">Batch 5</option>
                    <option value="batch6">Batch 6</option>
                </select>
            </div>
            <div class="control-group">
                <label>Filter Day</label>
                <select id="dayFilter" onchange="applyFilters()">
                    <option value="">All Days</option>
                    <option value="D1">Day 1</option>
                    <option value="D2">Day 2</option>
                    <option value="D3">Day 3</option>
                    <option value="D4">Day 4</option>
                    <option value="D5">Day 5</option>
                </select>
            </div>
        </div>

        <div class="export-box">
            <label style="color: var(--success)">📥 Advanced Export Tool</label>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <div class="control-group" style="flex: 1;">
                    <label>Select Batch</label>
                    <select id="expBatch">
                        <option value="">Choose...</option>
                        <option value="batch1">B1</option>
                        <option value="batch2">B2</option>
                        <option value="batch3">B3</option>
                        <option value="batch4">B4</option>
                        <option value="batch5">B5</option>
                        <option value="batch6">B6</option>
                    </select>
                </div>
                <div class="control-group" style="flex: 1;">
                    <label>Select Day (Optional)</label>
                    <select id="expDay">
                        <option value="">All Days</option>
                        <option value="D1">D1</option>
                        <option value="D2">D2</option>
                        <option value="D3">D3</option>
                        <option value="D4">D4</option>
                        <option value="D5">D5</option>
                    </select>
                </div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 12px;">
                <button onclick="exportBatchOnly()" class="btn-export-batch">Download Batch Only</button>
                <button onclick="exportByBatchAndDay()" class="btn-export-day">Download Batch + Day</button>
            </div>
        </div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Gender</th>
                    <th>Institution</th>
                    <th>Province</th>
                    <th>Batch</th>
                    <th>Cluster</th>
                    <th>Session ID</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const URLS = {
        panay: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSNs_RBN6sLDKG1GdPw-zAUBQc94_EVztntR4kWCmkebFUATHQalopVuzhlEBCBeJ0nNki8zn75pPTU/pub?output=csv',
        mindanao: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vROJBuC8QcVYdbkOWg7UlUhVAgnFOSa9i7p7HRGgABYIPdsxw31MEx0fzBrkH5I1_k2-mSDf6Y2itVJ/pub?output=csv',
        original: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTJEJuWYBbbEtvlroXnqVtjt2V4Ev_F8iT4HR0Pi419O1xEgD4VDfFcyuaT1XiMmG6AZtX8yR5euWyc/pub?output=csv'
    };

    const SCHEDULE = [
        { day:"1", session:"AM", preferredRoom:1, id:"D1AM-R1", match:["CompuThinkers K","ICT Essentials","Computer Fundamentals"] },
        { day:"1", session:"AM", preferredRoom:2, id:"D1AM-R2", match:["Word Desktop Publishing","Productivity Tools"] },
        { day:"1", session:"AM", preferredRoom:3, id:"D1AM-R3", match:["Scratch Fun with mBlock"] },
        { day:"1", session:"PM", preferredRoom:1, id:"D1PM-R1", match:["Scratch Jr","Basic Programming"] },
        { day:"1", session:"PM", preferredRoom:2, id:"D1PM-R2", match:["Web Design Basics","HTML and CSS"] },
        { day:"1", session:"PM", preferredRoom:3, id:"D1PM-R3", match:["Inkscape","Vector Graphics"] },
        { day:"2", session:"AM", preferredRoom:1, id:"D2AM-R1", match:["PowerPoint"] },
        { day:"2", session:"AM", preferredRoom:2, id:"D2AM-R2", match:["Clipchamp","Lights Camera Click"] },
        { day:"2", session:"AM", preferredRoom:3, id:"D2AM-R3", match:["Java Programming Fundamentals"] },
        { day:"2", session:"PM", preferredRoom:1, id:"D2PM-R1", match:["HTML Basics"] },
        { day:"2", session:"PM", preferredRoom:2, id:"D2PM-R2", match:["Python Coding"] },
        { day:"2", session:"PM", preferredRoom:3, id:"D2PM-R3", match:["E-Commerce"] },
        { day:"3", session:"AM", preferredRoom:1, id:"D3AM-R1", match:["Multimedia Creation"] },
        { day:"3", session:"AM", preferredRoom:2, id:"D3AM-R2", match:["Media and Information Literacy","Empowerment Technologies"] },
        { day:"3", session:"AM", preferredRoom:3, id:"D3AM-R3", match:["Java Advanced","Java GUI"] },
        { day:"3", session:"PM", preferredRoom:1, id:"D3PM-R1", match:["Arduino 1","Codey Rocky","RoboPrime1"] },
        { day:"3", session:"PM", preferredRoom:2, id:"D3PM-R2", match:["RoboJuno 1","CyberPi Console"] },
        { day:"3", session:"PM", preferredRoom:3, id:"D3PM-R3", match:["RoboStarter K"] },
        { day:"4", session:"AM", preferredRoom:1, id:"D4AM-R1", match:["Arduino 2","Exploring Arduino"] },
        { day:"4", session:"AM", preferredRoom:2, id:"D4AM-R2", match:["RoboPrime 2","Let’s Code with Codey Rocky"] },
        { day:"4", session:"AM", preferredRoom:3, id:"D4AM-R3", match:["RoboJuno 2 – Assemble mBot2","Assemble mBot2"] },
        { day:"4", session:"PM", preferredRoom:1, id:"D4PM-R1", match:["Arduino 3","Arduino Circuits"] },
        { day:"4", session:"PM", preferredRoom:2, id:"D4PM-R2", match:["RoboPrime 4","MicroBit Companion"] },
        { day:"4", session:"PM", preferredRoom:3, id:"D4PM-R3", match:["RoboJuno 2 – Let’s Code"] },
        { day:"5", session:"AM", preferredRoom:1, id:"D5AM-R1", match:["Arduino UNO R4 - Blink"] },
        { day:"5", session:"AM", preferredRoom:2, id:"D5AM-R2", match:["RoboPrime 5","MicroBit with Scratch"] },
        { day:"5", session:"AM", preferredRoom:3, id:"D5AM-R3", match:["mBot 2: Manual Challenge"] },
        { day:"5", session:"PM", preferredRoom:1, id:"D5PM-R1", match:["Arduino UNO R4 - Code Connect","IoT"] },
        { day:"5", session:"PM", preferredRoom:2, id:"D5PM-R2", match:["RoboPrime 6","Build and Connect with RingBit"] },
        { day:"5", session:"PM", preferredRoom:3, id:"D5PM-R3", match:["mBot 2: Autonomous Challenge"] }
    ];

    let datasets = { original: [], panay: [], mindanao: [] };
    let filteredData = [];
    let activeSource = 'original';

    function getSessionInfo(workshopText) {
        if (!workshopText) return { id: 'N/A', day: '' };
        const found = SCHEDULE.find(s => s.match.some(m => workshopText.toLowerCase().includes(m.toLowerCase())));
        return found ? { id: found.id, day: `D${found.day}` } : { id: 'Other', day: '' };
    }

    async function fetchCSV(url, key) {
        const response = await fetch(url + '&t=' + Date.now());
        const text = await response.text();
        const rows = text.split('\n').filter(r => r.trim() !== "");
        const headers = rows[0].split(',').map(h => h.trim().toLowerCase().replace(/"/g, ''));
        const uniqueEntries = new Map();

        rows.slice(1).forEach(row => {
            const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim());
            const fname = (cols[headers.indexOf('firstname')] || '').trim();
            const lname = (cols[headers.indexOf('lastname')] || '').trim();
            const inst = (cols[headers.indexOf('institution')] || '').trim();
            const workshopTxt = (cols[headers.indexOf('workshop')] || '').trim();
            let rawBatch = (cols[headers.indexOf('schedule')] || '').toLowerCase().replace(/\s/g, '');

            const uniqueId = `${fname}|${lname}`.toLowerCase();

            if (fname && !uniqueEntries.has(uniqueId)) {
                let assignedCluster = key;
                if (key === 'panay') rawBatch = 'batch3';
                if (key === 'mindanao') rawBatch = 'batch4';
                const session = getSessionInfo(workshopTxt);
                uniqueEntries.set(uniqueId, {
                    firstname: fname, lastname: lname,
                    gender: cols[headers.indexOf('gender')] || '',
                    province: cols[headers.indexOf('province')] || '',
                    institution: inst, batch: rawBatch,
                    workshop: workshopTxt, sessionId: session.id,
                    sessionDay: session.day, cluster: assignedCluster
                });
            }
        });
        return Array.from(uniqueEntries.values());
    }

    async function fetchAllData() {
        const btn = document.getElementById('syncBtn');
        btn.innerText = "⚡ Syncing...";
        try {
            const results = await Promise.all([
                fetchCSV(URLS.original, 'original'),
                fetchCSV(URLS.panay, 'panay'),
                fetchCSV(URLS.mindanao, 'mindanao')
            ]);
            datasets.original = results[0];
            datasets.panay = results[1];
            datasets.mindanao = results[2];
            document.getElementById('stat-orig-count').innerText = datasets.original.length;
            document.getElementById('stat-pan-count').innerText = datasets.panay.length;
            document.getElementById('stat-min-count').innerText = datasets.mindanao.length;
            applyFilters();
            btn.innerText = "🔄 Sync All Sheets";
        } catch (e) { btn.innerText = "❌ Error"; }
    }

    function switchSource(source, btn) {
        activeSource = source;
        document.querySelectorAll('.source-pill').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active-source'));
        document.getElementById(`card-${source}`).classList.add('active-source');
        applyFilters();
    }

    function applyFilters() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const batch = document.getElementById('batchFilter').value;
        const day = document.getElementById('dayFilter').value;
        const tbody = document.getElementById('tableBody');
        
        filteredData = datasets[activeSource].filter(d => {
            const fullName = (d.firstname + ' ' + d.lastname).toLowerCase();
            const matchesSearch = fullName.includes(search) || d.institution.toLowerCase().includes(search);
            const matchesBatch = batch === "" || d.batch === batch;
            const matchesDay = day === "" || d.sessionDay === day;
            return matchesSearch && matchesBatch && matchesDay;
        });

        tbody.innerHTML = filteredData.map(d => `
            <tr>
                <td>${d.firstname}</td><td>${d.lastname}</td>
                <td><small>${d.gender}</small></td><td>${d.institution}</td>
                <td>${d.province}</td><td><b style="color:var(--primary)">${d.batch.toUpperCase()}</b></td>
                <td><span class="tag tag-${d.cluster}">${d.cluster}</span></td>
                <td><small>${d.sessionId}</small></td>
            </tr>
        `).join('');
        updateBatchSummary();
    }

    function updateBatchSummary() {
        const counts = { batch1: 0, batch2: 0, batch3: 0, batch4: 0, batch5: 0, batch6: 0 };
        datasets[activeSource].forEach(d => { if(counts.hasOwnProperty(d.batch)) counts[d.batch]++; });
        Object.keys(counts).forEach(b => {
            const el = document.getElementById(`count-${b.replace('batch', 'b')}`);
            if(el) el.innerText = counts[b];
        });
    }

    // Helper to generate and download CSV
    function downloadCSV(data, fileName) {
        let csv = "\ufeffFirst Name,Last Name,Gender,Institution,Province,Batch,Day,SessionID,Workshop\n";
        data.forEach(d => {
            csv += `"${d.firstname}","${d.lastname}","${d.gender}","${d.institution}","${d.province}","${d.batch.toUpperCase()}","${d.sessionDay}","${d.sessionId}","${d.workshop}"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = fileName;
        link.click();
    }

    // New Function: Export by Batch Only
    function exportBatchOnly() {
        const selBatch = document.getElementById('expBatch').value;
        if (!selBatch) return alert("Please select a Batch.");

        const toExport = datasets[activeSource].filter(d => d.batch === selBatch);
        if (toExport.length === 0) return alert("No records found for this Batch.");

        downloadCSV(toExport, `${activeSource.toUpperCase()}_${selBatch}_Full_Export.csv`);
    }

    // Existing Function: Export by Batch and Day
    function exportByBatchAndDay() {
        const selBatch = document.getElementById('expBatch').value;
        const selDay = document.getElementById('expDay').value;
        if (!selBatch || !selDay) return alert("Please select both Batch and Day.");

        const toExport = datasets[activeSource].filter(d => d.batch === selBatch && d.sessionDay === selDay);
        if (toExport.length === 0) return alert("No records found for this combination.");

        downloadCSV(toExport, `${activeSource.toUpperCase()}_${selBatch}_${selDay}_Export.csv`);
    }

    fetchAllData();
</script>
</body>
</html>
